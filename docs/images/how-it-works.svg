<rect width="1100" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
<g stroke="#475569" stroke-width="2" marker-end="url(#a)">

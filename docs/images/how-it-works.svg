<g fill="#0f172a" font-size="17" font-weight="700">
<text x="115" y="125">Repositories</text><text x="325" y="125">Project discovery</text><text x="535" y="125">Architecture detection</text><text x="745" y="125">Cartridge resolution</text>
</g>
<g fill="#475569" font-size="14">
<text x="115" y="155">one or many</text><text x="115" y="176">cartridges, sites,</text><text x="115" y="197">headless apps</text>
<text x="325" y="155">cartridges, site.xml,</text><text x="325" y="176">compass.sites.json,</text><text x="325" y="197">routes, hooks</text>

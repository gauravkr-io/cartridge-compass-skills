</g>
<g fill="#ffffff" stroke="#0f766e" stroke-width="2">
<rect x="30" y="85" width="170" height="130" rx="10"/><rect x="240" y="85" width="170" height="130" rx="10"/><rect x="450" y="85" width="170" height="130" rx="10"/><rect x="660" y="85" width="170" height="130" rx="10"/>
